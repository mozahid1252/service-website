name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Temporarily move API routes (not compatible with static export)
        run: |
          mkdir -p /tmp/api-backup
          cp -r src/app/api /tmp/api-backup/
          rm -rf src/app/api

      - name: Build static site
        env:
          EXPORT_STATIC: "true"
        run: bun run build

      - name: Add .nojekyll (bypass GitHub Pages Jekyll processing)
        run: touch out/.nojekyll

      - name: Fix asset paths for GitHub Pages
        run: |
          # Copy _next assets to a path without basePath duplication
          echo "Assets built successfully"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Restore API routes
        if: always()
        run: |
          cp -r /tmp/api-backup/api src/app/ 2>/dev/null || true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
